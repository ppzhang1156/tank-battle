<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 Battle City</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #2a2a2a;
    --accent: #f5c842;
    --text: #e8e8e8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 20%, #2d2d2d, #111 80%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .hud {
    display: flex;
    gap: 24px;
    align-items: center;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .hud .label { color: #999; }
  .hud .value { color: var(--accent); font-weight: 700; min-width: 24px; display: inline-block; text-align: center; }
  .lives { display: flex; gap: 6px; align-items: center; }
  .tank-icon {
    width: 14px; height: 14px; border-radius: 3px;
    background: #f5c842;
    position: relative;
  }
  .tank-icon::after {
    content: ""; position: absolute; left: 5px; top: -3px;
    width: 4px; height: 4px; background: #f5c842;
  }
  canvas {
    background: #000;
    border: 3px solid #333;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,.7), 0 0 0 1px #000 inset;
    image-rendering: pixelated;
    display: block;
  }
  .tip { color: #888; font-size: 13px; text-align: center; line-height: 1.6; }
  .tip b { color: var(--accent); }
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.7); z-index: 10;
  }
  .overlay.hidden { display: none; }
  .card {
    background: var(--panel); border: 2px solid #444; border-radius: 12px;
    padding: 40px 56px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .card h1 { font-size: 34px; color: var(--accent); letter-spacing: 6px; margin-bottom: 8px; }
  .card h2 { font-size: 26px; color: #fff; letter-spacing: 3px; margin-bottom: 8px; }
  .card p { color: #bbb; margin: 12px 0; line-height: 1.7; font-size: 15px; }
  .card .score-final { font-size: 40px; color: var(--accent); font-weight: 800; margin: 10px 0; }
  .btn {
    display: inline-block; margin-top: 20px; padding: 12px 34px;
    background: var(--accent); color: #1a1a1a; border: none; border-radius: 8px;
    font-size: 17px; font-weight: 700; letter-spacing: 3px; cursor: pointer;
    transition: transform .1s, filter .1s;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
  .btn:active { transform: translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span class="label">得分</span><span class="value" id="score">0</span>
    <span class="label">波次</span><span class="value" id="level">1</span>
    <span class="lives" id="lives"></span>
    <span class="label">剩余敌人</span><span class="value" id="enemies">0</span>
  </div>
  <canvas id="game" width="520" height="520"></canvas>
  <div class="tip">
    方向键 / <b>WASD</b> 移动 · 空格 / <b>J</b> 开火 · <b>P</b> 暂停<br>
    保护基地（鹰旗），摧毁所有敌方坦克！
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <h1>坦克大战</h1>
    <p>守卫你的基地，消灭一波又一波的敌人</p>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------- 画布与常量 ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const TILE = 20;                 // 每格像素
  const COLS = 26;                 // 13*2? 使用 26x26 格 = 520px
  const ROWS = 26;
  canvas.width = COLS * TILE;
  canvas.height = ROWS * TILE;

  const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
  const DX = [0, 1, 0, -1];
  const DY = [-1, 0, 1, 0];

  // 元素类型
  const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, TREE = 4, BASE = 5;

  // 坦克类型
  const TYPE_PLAYER = 0, TYPE_ENEMY = 1;

  // ---------- 状态 ----------
  let grid = [];
  let player = null;
  let enemies = [];
  let bullets = [];
  let particles = [];
  let powerups = [];
  let score = 0;
  let lives = 3;
  let level = 1;
  let enemiesToSpawn = 0;
  let enemiesRemaining = 0;
  let spawnTimer = 0;
  let gameState = "menu";   // menu | playing | paused | over | win
  let frame = 0;
  let baseAlive = true;

  // ---------- 音效 (Web Audio) ----------
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
  }
  function beep(freq, dur = 0.06, type = "square", vol = 0.06) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }
  const sfx = {
    shoot: () => beep(220, 0.05, "square", 0.04),
    hit:   () => beep(90, 0.08, "sawtooth", 0.05),
    boom:  () => beep(60, 0.25, "sawtooth", 0.09),
    power: () => beep(880, 0.12, "triangle", 0.08),
    level: () => { beep(523, 0.1); setTimeout(() => beep(659, 0.1), 100); setTimeout(() => beep(784, 0.15), 200); },
  };

  // ---------- 地图 ----------
  function buildLevel(n) {
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
    // 边界
    for (let x = 0; x < COLS; x++) { grid[0][x] = STEEL; grid[ROWS-1][x] = STEEL; }
    for (let y = 0; y < ROWS; y++) { grid[y][0] = STEEL; grid[y][COLS-1] = STEEL; }

    // 砖块图案，随波次变化
    const patterns = [];
    patterns.push([
      [4,4],[5,4],[6,4],[9,4],[10,4],[11,4],[15,4],[16,4],[17,4],[20,4],[21,4],[22,4],
      [4,8],[5,8],[6,8],[9,8],[10,8],[11,8],[15,8],[16,8],[17,8],[20,8],[21,8],[22,8],
    ]);
    patterns.push([
      [2,6],[3,6],[4,6],[6,6],[7,6],[8,6],
      [2,10],[3,10],[4,10],[6,10],[7,10],[8,10],
      [16,6],[17,6],[18,6],[20,6],[21,6],[22,6],
      [16,10],[17,10],[18,10],[20,10],[21,10],[22,10],
    ]);
    const pat = patterns[(n - 1) % patterns.length];
    for (const [x, y] of pat) grid[y][x] = BRICK;

    // 中下钢墙守卫基地
    const bx = Math.floor(COLS / 2);
    const by = ROWS - 4;
    for (let y = by - 1; y <= by + 1; y++) {
      for (let x = bx - 1; x <= bx + 1; x++) {
        grid[y][x] = (x === bx && y === by + 1) ? BRICK : STEEL;
      }
    }
    // 基地
    grid[by][bx] = BASE;
    grid[by][bx - 1] = BRICK;
    grid[by][bx + 1] = BRICK;

    // 树
    for (const [x, y] of [[5, 12], [12, 16], [20, 12], [8, 20], [18, 20]]) {
      if (grid[y][x] === EMPTY) grid[y][x] = TREE;
    }
  }

  // ---------- 坦克对象 ----------
  function createTank(x, y, dir, type) {
    return {
      x, y, dir, type,
      speed: type === TYPE_PLAYER ? 2.2 : 1.4,
      size: TILE - 2,
      cooldown: 0,
      maxCooldown: type === TYPE_PLAYER ? 14 : 60,
      bulletSpeed: 6,
      bulletPower: 1,
      lives: type === TYPE_ENEMY ? 1 : 0, // 敌方血量（高级坦克2血）
      shield: type === TYPE_PLAYER ? 180 : 0, // 出生无敌帧
      frozen: 0,
      moving: false,
      aiTurn: Math.random() * 90,
    };
  }

  function canMove(t, nx, ny) {
    const half = t.size / 2;
    const cx = nx, cy = ny;
    // 四个角检测
    const pts = [[cx - half, cy - half], [cx + half, cy - half], [cx - half, cy + half], [cx + half, cy + half]];
    for (const [px, py] of pts) {
      if (px < 0 || py < 0 || px >= canvas.width || py >= canvas.height) return false;
      const gx = Math.floor(px / TILE), gy = Math.floor(py / TILE);
      if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return false;
      const c = grid[gy][gx];
      if (c === BRICK || c === STEEL || c === WATER || c === BASE) return false;
    }
    // 与其他坦克碰撞
    for (const other of [...enemies, player].filter(Boolean)) {
      if (other === t) continue;
      if (Math.abs(other.x - cx) < TILE - 1 && Math.abs(other.y - cy) < TILE - 1) return false;
    }
    return true;
  }

  // ---------- 子弹 ----------
  function createBullet(t) {
    const b = {
      x: t.x, y: t.y, dir: t.dir,
      speed: t.bulletSpeed,
      fromPlayer: t.type === TYPE_PLAYER,
      power: t.bulletPower,
      size: 4,
    };
    // 从炮口发射
    b.x += DX[b.dir] * (TILE / 2 + 2);
    b.y += DY[b.dir] * (TILE / 2 + 2);
    return b;
  }

  function shoot(t) {
    if (t.cooldown > 0) return;
    t.cooldown = t.maxCooldown;
    bullets.push(createBullet(t));
    sfx.shoot();
  }

  // ---------- 粒子 ----------
  function spawnBoom(x, y, color = "#ff9933") {
    for (let i = 0; i < 12; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        life: 20 + Math.random() * 15,
        maxLife: 35,
        color,
      });
    }
  }

  // ---------- 出生敌人 ----------
  function spawnEnemy() {
    const spots = [[0, 0], [COLS/2 - 1, 0], [COLS - 2, 0]];
    const [gx, gy] = spots[Math.floor(Math.random() * spots.length)];
    const t = createTank(gx * TILE + TILE/2, gy * TILE + TILE/2, DIR.DOWN, TYPE_ENEMY);
    t.lives = (level >= 3 && Math.random() < 0.25) ? 2 : 1;
    t.speed = 1.1 + Math.min(level * 0.08, 0.8) + Math.random() * 0.2;
    t.shield = 60;
    t.maxCooldown = Math.max(30, 70 - level * 4);
    enemies.push(t);
    enemiesToSpawn--;
  }

  // ---------- 道具 ----------
  function dropPowerup(x, y) {
    if (Math.random() < 0.25) {
      const kinds = ["life", "shield", "speed", "power", "freeze"];
      powerups.push({ x, y, kind: kinds[Math.floor(Math.random() * kinds.length)], life: 600 });
    }
  }

  function applyPowerup(kind) {
    sfx.power();
    switch (kind) {
      case "life": lives = Math.min(lives + 1, 6); break;
      case "shield": player.shield = Math.max(player.shield, 600); break;
      case "speed": player.bulletSpeed = Math.min(player.bulletSpeed + 1, 10); break;
      case "power": player.bulletPower = Math.min(player.bulletPower + 1, 3); break;
      case "freeze": enemies.forEach(e => e.frozen = 300); break;
    }
  }

  // ---------- 游戏流程 ----------
  function startGame() {
    initAudio();
    score = 0; lives = 3; level = 1;
    startLevel();
    gameState = "playing";
    updateHUD();
    hideOverlay();
  }

  function startLevel() {
    buildLevel(level);
    bullets = []; particles = []; powerups = [];
    enemies = [];
    player = createTank((COLS/2) * TILE, (ROWS - 2) * TILE - 4, DIR.UP, TYPE_PLAYER);
    player.shield = 180;
    baseAlive = true;
    enemiesToSpawn = 4 + Math.min(level, 8); // 每波敌人数量
    enemiesRemaining = enemiesToSpawn;
    spawnTimer = 30;
    sfx.level();
    updateHUD();
  }

  function gameOver() {
    gameState = "over";
    showOverlay("游戏结束", "你被击毁了", score);
  }

  function win() {
    gameState = "win";
    score += 500;
    showOverlay("关卡完成！", "准备进入下一波", score);
  }

  // ---------- 更新 ----------
  function update() {
    if (gameState !== "playing") return;
    frame++;

    // 敌人刷新
    if (enemiesToSpawn > 0) {
      spawnTimer--;
      if (spawnTimer <= 0 && enemies.length < 4) {
        spawnEnemy();
        spawnTimer = 120;
      }
    }

    // 玩家
    if (player) {
      updatePlayer();
      if (player.shield > 0) player.shield--;
      if (player.cooldown > 0) player.cooldown--;
    }

    // 敌人
    for (const e of enemies) {
      updateEnemy(e);
      if (e.shield > 0) e.shield--;
      if (e.cooldown > 0) e.cooldown--;
      if (e.frozen > 0) e.frozen--;
    }

    // 子弹
    for (const b of bullets) {
      b.x += DX[b.dir] * b.speed;
      b.y += DY[b.dir] * b.speed;
    }
    handleBulletCollisions();

    // 道具
    for (const p of powerups) {
      p.life--;
      if (player && Math.abs(p.x - player.x) < TILE && Math.abs(p.y - player.y) < TILE) {
        applyPowerup(p.kind);
        p.life = 0;
      }
    }
    powerups = powerups.filter(p => p.life > 0);

    // 粒子
    for (const pt of particles) {
      pt.x += pt.vx; pt.y += pt.vy; pt.life--;
    }
    particles = particles.filter(pt => pt.life > 0);

    enemies = enemies.filter(e => e.lives > 0);

    // 判断胜负
    if (!baseAlive) { gameOver(); return; }
    if (!player) { lives--; if (lives <= 0) { gameOver(); return; } respawnPlayer(); }
    if (enemiesToSpawn === 0 && enemies.length === 0) { win(); }
  }

  function updatePlayer() {
    let dx = 0, dy = 0;
    if (keys["ArrowUp"] || keys["w"] || keys["W"]) dy = -1;
    else if (keys["ArrowDown"] || keys["s"] || keys["S"]) dy = 1;
    else if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dx = -1;
    else if (keys["ArrowRight"] || keys["d"] || keys["D"]) dx = 1;

    if (dx !== 0 || dy !== 0) {
      let dir;
      if (dy < 0) dir = DIR.UP;
      else if (dy > 0) dir = DIR.DOWN;
      else if (dx < 0) dir = DIR.LEFT;
      else dir = DIR.RIGHT;

      if (dir !== player.dir) {
        // 允许转身
        player.dir = dir;
      }
      const nx = player.x + DX[player.dir] * player.speed;
      const ny = player.y + DY[player.dir] * player.speed;
      if (canMove(player, nx, ny)) {
        player.x = nx; player.y = ny;
      }
    }
  }

  function updateEnemy(e) {
    if (e.frozen > 0) return;
    e.aiTurn--;
    if (e.aiTurn <= 0) {
      e.dir = Math.floor(Math.random() * 4);
      e.aiTurn = 60 + Math.random() * 120;
    }
    const nx = e.x + DX[e.dir] * e.speed;
    const ny = e.y + DY[e.dir] * e.speed;
    if (canMove(e, nx, ny)) {
      e.x = nx; e.y = ny;
    } else {
      e.dir = Math.floor(Math.random() * 4);
      e.aiTurn = 30 + Math.random() * 60;
    }

    // 朝玩家方向开火（概率）
    if (player && e.cooldown <= 0) {
      const dxp = player.x - e.x, dyp = player.y - e.y;
      let fire = false;
      if (Math.abs(dxp) < TILE * 0.8 && Math.abs(dyp) < 20) {
        e.dir = dxp > 0 ? DIR.RIGHT : DIR.LEFT; fire = Math.random() < 0.5;
      } else if (Math.abs(dyp) < TILE * 0.8 && Math.abs(dxp) < 20) {
        e.dir = dyp > 0 ? DIR.DOWN : DIR.UP; fire = Math.random() < 0.5;
      }
      if (fire) shoot(e);
    }
  }

  function respawnPlayer() {
    player = createTank((COLS/2) * TILE, (ROWS - 2) * TILE - 4, DIR.UP, TYPE_PLAYER);
    player.shield = 180;
    updateHUD();
  }

  function handleBulletCollisions() {
    const toRemove = new Set();
    const newBullets = [];

    for (const b of bullets) {
      let consumed = false;

      // 出界
      if (b.x < 0 || b.y < 0 || b.x >= canvas.width || b.y >= canvas.height) { toRemove.add(b); continue; }

      const gx = Math.floor(b.x / TILE), gy = Math.floor(b.y / TILE);
      const cell = grid[gy] ? grid[gy][gx] : null;

      // 钢墙：反弹
      if (cell === STEEL) {
        b.dir = (b.dir + 2) % 4;
        b.x += DX[b.dir] * 3; b.y += DY[b.dir] * 3;
        sfx.hit();
        continue;
      }
      // 砖墙：摧毁
      if (cell === BRICK) {
        grid[gy][gx] = EMPTY;
        spawnBoom(gx * TILE + TILE/2, gy * TILE + TILE/2, "#c8763c");
        toRemove.add(b); consumed = true;
        sfx.hit();
      }
      // 基地被毁
      if (cell === BASE) {
        grid[gy][gx] = EMPTY;
        baseAlive = false;
        spawnBoom(gx * TILE + TILE/2, gy * TILE + TILE/2, "#ff5533");
        toRemove.add(b); consumed = true;
        sfx.boom();
      }

      // 打中坦克
      const targets = b.fromPlayer ? enemies : [player].filter(Boolean);
      for (const t of targets) {
        if (toRemove.has(b)) break;
        if (t && Math.abs(t.x - b.x) < t.size / 2 + b.size && Math.abs(t.y - b.y) < t.size / 2 + b.size) {
          if (t.shield > 0) {
            // 护盾挡子弹
            toRemove.add(b); consumed = true;
            sfx.hit();
          } else {
            t.lives -= b.power;
            toRemove.add(b); consumed = true;
            if (t.lives <= 0) {
              spawnBoom(t.x, t.y, t.type === TYPE_ENEMY ? "#ff9933" : "#f5c842");
              sfx.boom();
              if (t.type === TYPE_ENEMY) {
                score += 100;
                enemiesRemaining = enemiesToSpawn + enemies.length - 1;
                dropPowerup(t.x, t.y);
              }
              t.lives = -1; // 标记删除
            } else {
              sfx.hit();
            }
          }
        }
      }

      // 子弹对撞
      if (!toRemove.has(b)) {
        for (const b2 of bullets) {
          if (b2 === b || toRemove.has(b2)) continue;
          if (b.fromPlayer !== b2.fromPlayer && Math.abs(b.x - b2.x) < 6 && Math.abs(b.y - b2.y) < 6) {
            toRemove.add(b); toRemove.add(b2);
            spawnBoom(b.x, b.y, "#fff");
            break;
          }
        }
      }

      if (!consumed && !toRemove.has(b)) newBullets.push(b);
    }

    bullets = newBullets;
    updateHUD();
  }

  // ---------- 渲染 ----------
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    drawPowerups();
    drawBullets();
    if (player) drawTank(player);
    for (const e of enemies) drawTank(e);
    drawParticles();
    if (gameState === "paused") drawPaused();
  }

  function drawGrid() {
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const c = grid[y][x];
        const px = x * TILE, py = y * TILE;
        if (c === EMPTY) continue;
        if (c === BRICK) {
          ctx.fillStyle = "#b04a2a";
          ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = "#d96a3a";
          ctx.fillRect(px + 1, py + 1, TILE/2 - 1, TILE/2 - 1);
          ctx.fillRect(px + TILE/2, py + TILE/2, TILE/2 - 1, TILE/2 - 1);
          ctx.fillStyle = "#8a3018";
          ctx.fillRect(px + TILE/2, py + 1, TILE/2 - 1, TILE/2 - 1);
          ctx.fillRect(px + 1, py + TILE/2, TILE/2 - 1, TILE/2 - 1);
        } else if (c === STEEL) {
          ctx.fillStyle = "#777";
          ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = "#ccc";
          ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
          ctx.fillStyle = "#555";
          ctx.fillRect(px + 4, py + 4, TILE - 8, TILE - 8);
        } else if (c === WATER) {
          ctx.fillStyle = "#1e6ea0";
          ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = "#2b8ec4";
          if (frame % 20 < 10) { ctx.fillRect(px + 3, py + 3, TILE - 6, 3); }
          else { ctx.fillRect(px + 3, py + TILE - 6, TILE - 6, 3); }
        } else if (c === TREE) {
          ctx.fillStyle = "#1e7a2e";
          ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = "#2fa03f";
          ctx.beginPath();
          ctx.arc(px + TILE/2, py + TILE/2, TILE/2 - 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (c === BASE) {
          ctx.fillStyle = "#333";
          ctx.fillRect(px, py, TILE, TILE);
          drawEagle(px + TILE/2, py + TILE/2);
        }
      }
    }
  }

  function drawEagle(cx, cy) {
    // 简易鹰徽
    ctx.fillStyle = "#f5c842";
    ctx.beginPath();
    ctx.moveTo(cx - 7, cy + 5);
    ctx.lineTo(cx - 4, cy - 5);
    ctx.lineTo(cx, cy - 2);
    ctx.lineTo(cx + 4, cy - 5);
    ctx.lineTo(cx + 7, cy + 5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#e8a020";
    ctx.fillRect(cx - 1, cy + 2, 2, 5);
  }

  function drawTank(t) {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.dir * Math.PI / 2);
    const s = t.size;
    const half = s / 2;

    // 履带
    ctx.fillStyle = "#3a3a3a";
    ctx.fillRect(-half, -half, 5, s);
    ctx.fillRect(half - 5, -half, 5, s);
    ctx.fillStyle = "#555";
    for (let i = -half + 1; i < half - 1; i += 4) {
      ctx.fillRect(-half + 1, i, 3, 2);
      ctx.fillRect(half - 4, i, 3, 2);
    }

    // 车身
    ctx.fillStyle = t.type === TYPE_PLAYER ? "#f5c842" : "#c23b3b";
    ctx.fillRect(-half + 3, -half + 2, s - 6, s - 4);

    // 炮塔
    ctx.fillStyle = t.type === TYPE_PLAYER ? "#e0a020" : "#8f2525";
    ctx.fillRect(-half + 5, -half + 5, s - 10, s - 10);

    // 炮管
    ctx.fillStyle = "#222";
    ctx.fillRect(-2, -half - 5, 4, 8);

    ctx.restore();

    // 护盾
    if (t.shield > 0) {
      const blink = Math.floor(t.shield / 4) % 2 === 0;
      if (blink || t.shield > 60) {
        ctx.strokeStyle = "rgba(120,200,255,.9)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(t.x, t.y, s / 2 + 4, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function drawBullets() {
    for (const b of bullets) {
      ctx.fillStyle = b.fromPlayer ? "#fff" : "#ffd0d0";
      ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
      ctx.fillStyle = b.fromPlayer ? "#ffe9a0" : "#ff9999";
      ctx.fillRect(b.x - 1, b.y - 1, 2, 2);
    }
  }

  function drawPowerups() {
    for (const p of powerups) {
      const blink = Math.floor(frame / 5) % 2;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = "rgba(0,0,0,.4)";
      ctx.fillRect(-7, -7, 14, 14);
      ctx.fillStyle = p.kind === "life" ? "#5ad95a" :
                      p.kind === "shield" ? "#5ab8ff" :
                      p.kind === "speed" ? "#c05aff" :
                      p.kind === "power" ? "#ff5a5a" : "#5affd0";
      if (blink) ctx.fillRect(-5, -5, 10, 10);
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const pt of particles) {
      const a = pt.life / pt.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawPaused() {
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 40px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("暂停中", canvas.width / 2, canvas.height / 2);
    ctx.textAlign = "left";
  }

  // ---------- HUD / 覆盖层 ----------
  const scoreEl = document.getElementById("score");
  const levelEl = document.getElementById("level");
  const enemiesEl = document.getElementById("enemies");
  const livesEl = document.getElementById("lives");
  const overlay = document.getElementById("overlay");
  const startBtn = document.getElementById("startBtn");
  const card = document.querySelector(".card");

  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    enemiesEl.textContent = enemiesToSpawn + enemies.length;
    livesEl.innerHTML = "";
    for (let i = 0; i < lives; i++) {
      const d = document.createElement("span");
      d.className = "tank-icon";
      livesEl.appendChild(d);
    }
  }

  function showOverlay(title, subtitle, finalScore) {
    card.innerHTML = `
      <h2>${title}</h2>
      <p>${subtitle}</p>
      <div class="score-final">${finalScore}</div>
      <p style="margin-top:-6px;">最终得分</p>
      <button class="btn" id="againBtn">重新开始</button>
    `;
    document.getElementById("againBtn").addEventListener("click", () => {
      startGame();
    });
    overlay.classList.remove("hidden");
  }

  function hideOverlay() {
    overlay.classList.add("hidden");
  }

  function togglePause() {
    if (gameState === "playing") gameState = "paused";
    else if (gameState === "paused") gameState = "playing";
  }

  // ---------- 输入 ----------
  const keys = {};
  window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
    if (e.key === " " || e.key === "j" || e.key === "J") {
      e.preventDefault();
      if (gameState === "playing" && player) shoot(player);
    }
    if (e.key === "p" || e.key === "P") togglePause();
    if (e.key === "Enter" && gameState === "menu") startGame();
  });
  window.addEventListener("keyup", (e) => { keys[e.key] = false; });

  startBtn.addEventListener("click", startGame);

  // ---------- 主循环 ----------
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(1);
  updateHUD();
  loop();
})();
</script>
</body>
</html>
